# Spark on YARN sized for 1536 MB NodeManagers (PLAN.md §3.2); client mode from the edge container.
# Each NodeManager fits the AM (768 MB incl. overhead) + one executor (512 + 256 MB): LITE runs 1 executor,
# the full 2-NodeManager cluster runs 2.
spark.master                      yarn
spark.submit.deployMode           client
spark.driver.memory               768m
spark.yarn.am.memory              384m
spark.executor.instances          2
spark.executor.memory             512m
spark.executor.memoryOverhead     256m
spark.executor.cores              1
spark.dynamicAllocation.enabled   false
spark.sql.shuffle.partitions      16
spark.sql.adaptive.enabled        true
spark.sql.catalogImplementation   hive
spark.hadoop.hive.metastore.uris  thrift://hive-metastore:9083
spark.sql.warehouse.dir           /gh/curated/warehouse
# Spark's built-in Hive 2.3.9 client talks to our Hive 3.1.3 metastore over Thrift
spark.sql.hive.convertMetastoreParquet  true
spark.sql.parquet.int96RebaseModeInRead   CORRECTED
spark.sql.parquet.int96RebaseModeInWrite  CORRECTED
spark.sql.sources.partitionOverwriteMode  dynamic
# Executors run in NodeManager containers (bda/hadoop image): use its system Python 3.12 (same version as
# the driver's /opt/venv). Only needed when Python objects reach executors; jobs stay DataFrame-only otherwise.
spark.pyspark.python              /usr/bin/python3
spark.pyspark.driver.python       /opt/venv/bin/python
spark.eventLog.enabled            false
spark.ui.showConsoleProgress      false
