# GitHub Open Source Pulse: cluster definition.
# Use scripts/stage.sh <stage> rather than raw profiles: it also stops services the stage doesn't need.

x-stack-volumes: &stack-volumes
  - ./docker/conf/hadoop:/opt/hadoop/etc/hadoop:ro
  - ./docker/conf/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro

x-hadoop: &hadoop
  image: bda/hadoop:3.3.6
  restart: unless-stopped
  volumes:
    - ./docker/conf/hadoop:/opt/hadoop/etc/hadoop:ro
  environment: &hadoop-env
    TZ: UTC

services:
  hadoop-image:            # build-only service so `docker compose build` produces bda/hadoop
    image: bda/hadoop:3.3.6
    build: { context: ./docker, dockerfile: hadoop/Dockerfile, args: { HADOOP_VERSION: "${HADOOP_VERSION:-3.3.6}" } }
    profiles: ["build"]

  stack-image:             # build-only: bda/stack (Hive, Pig, Sqoop, Mahout, Spark, HBase)
    image: bda/stack:1
    build: { context: ./docker, dockerfile: stack/Dockerfile }
    profiles: ["build"]

  airflow-image:           # build-only: bda/airflow
    image: bda/airflow:1
    build: { context: ./docker, dockerfile: airflow/Dockerfile }
    profiles: ["build"]

  postgres:
    image: postgres:16
    container_name: bda-postgres
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 384m
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HIVE_DB_PASSWORD: ${HIVE_DB_PASSWORD}
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 20 }

  namenode:
    <<: *hadoop
    container_name: bda-namenode
    hostname: namenode
    profiles: ["core"]
    command: namenode
    mem_limit: 768m
    ports: ["9870:9870", "8020:8020"]
    environment: { <<: *hadoop-env, HDFS_NAMENODE_OPTS: "-Xmx512m" }
    volumes:
      - ./docker/conf/hadoop:/opt/hadoop/etc/hadoop:ro
      - nn-data:/data
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:9870/"], interval: 5s, retries: 30 }

  datanode1:
    <<: *hadoop
    container_name: bda-datanode1
    hostname: datanode1
    profiles: ["core"]
    command: datanode
    mem_limit: 512m
    ports: ["9864:9864"]
    environment: { <<: *hadoop-env, HDFS_DATANODE_OPTS: "-Xmx256m" }
    volumes:
      - ./docker/conf/hadoop:/opt/hadoop/etc/hadoop:ro
      - dn1-data:/data
    depends_on: { namenode: { condition: service_healthy } }

  datanode2:
    <<: *hadoop
    container_name: bda-datanode2
    hostname: datanode2
    profiles: ["core"]
    command: datanode
    mem_limit: 512m
    ports: ["9865:9864"]
    environment: { <<: *hadoop-env, HDFS_DATANODE_OPTS: "-Xmx256m" }
    volumes:
      - ./docker/conf/hadoop:/opt/hadoop/etc/hadoop:ro
      - dn2-data:/data
    depends_on: { namenode: { condition: service_healthy } }

  resourcemanager:
    <<: *hadoop
    container_name: bda-resourcemanager
    hostname: resourcemanager
    profiles: ["core"]
    command: resourcemanager
    mem_limit: 640m
    ports: ["8088:8088"]
    environment: { <<: *hadoop-env, YARN_RESOURCEMANAGER_OPTS: "-Xmx384m" }
    depends_on: { namenode: { condition: service_healthy } }

  nodemanager1:
    <<: *hadoop
    container_name: bda-nodemanager1
    hostname: nodemanager1
    profiles: ["core"]
    command: nodemanager
    mem_limit: 2g
    ports: ["8042:8042"]
    environment: { <<: *hadoop-env, YARN_NODEMANAGER_OPTS: "-Xmx256m" }
    depends_on: [resourcemanager]

  nodemanager2:
    <<: *hadoop
    container_name: bda-nodemanager2
    hostname: nodemanager2
    profiles: ["core"]
    command: nodemanager
    mem_limit: 2g
    ports: ["8043:8042"]
    environment: { <<: *hadoop-env, YARN_NODEMANAGER_OPTS: "-Xmx256m" }
    depends_on: [resourcemanager]

  historyserver:
    <<: *hadoop
    container_name: bda-historyserver
    hostname: historyserver
    profiles: ["core"]
    command: historyserver
    mem_limit: 448m
    ports: ["19888:19888"]
    environment: { <<: *hadoop-env, MAPRED_HISTORYSERVER_OPTS: "-Xmx256m" }
    depends_on: { namenode: { condition: service_healthy } }

  hive-metastore:
    <<: *hadoop
    image: bda/stack:1
    container_name: bda-hive-metastore
    hostname: hive-metastore
    profiles: ["warehouse", "impala", "ml"]
    command: hive-metastore
    mem_limit: 640m
    ports: ["9083:9083"]
    environment: { <<: *hadoop-env, HADOOP_HEAPSIZE: "512", HIVE_DB_PASSWORD: "${HIVE_DB_PASSWORD}" }
    volumes: *stack-volumes
    depends_on: { postgres: { condition: service_healthy }, namenode: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "nc", "-z", "localhost", "9083"], interval: 5s, retries: 60 }

  hiveserver2:
    <<: *hadoop
    image: bda/stack:1
    container_name: bda-hiveserver2
    hostname: hiveserver2
    profiles: ["warehouse"]
    command: hiveserver2
    mem_limit: 1g
    ports: ["10000:10000", "10002:10002"]
    environment: { <<: *hadoop-env, HADOOP_HEAPSIZE: "768", HIVE_DB_PASSWORD: "${HIVE_DB_PASSWORD}" }
    volumes: *stack-volumes
    depends_on: { hive-metastore: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "nc", "-z", "localhost", "10000"], interval: 5s, retries: 60 }

  # --- Serving + streaming: one ZooKeeper shared by HBase, Kafka and Storm ---
  zookeeper:
    image: zookeeper:3.8
    container_name: bda-zookeeper
    hostname: zookeeper
    profiles: ["serving", "streaming"]
    mem_limit: 384m
    environment: { JVMFLAGS: "-Xmx256m", ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr" }
    ports: ["2181:2181"]
    volumes: [zk-data:/data]

  hbase-master:
    <<: *hadoop
    image: bda/stack:1
    container_name: bda-hbase-master
    hostname: hbase-master
    profiles: ["serving", "streaming"]
    command: hbase-master
    mem_limit: 640m
    ports: ["16010:16010"]
    environment: &hbase-env
      TZ: UTC
      HBASE_MANAGES_ZK: "false"
      HBASE_HEAPSIZE: "384m"
      # Use HBase's own bundled Hadoop client jars; just add our Hadoop config to its classpath
      HBASE_DISABLE_HADOOP_CLASSPATH_LOOKUP: "true"
      HBASE_CLASSPATH: /opt/hadoop/etc/hadoop
    volumes: &hbase-volumes
      - ./docker/conf/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./docker/conf/hbase/hbase-site.xml:/opt/hbase/conf/hbase-site.xml:ro
    depends_on: [zookeeper]

  hbase-regionserver:
    <<: *hadoop
    image: bda/stack:1
    container_name: bda-hbase-regionserver
    hostname: hbase-regionserver
    profiles: ["serving", "streaming"]
    command: hbase-regionserver
    mem_limit: 1280m
    ports: ["16030:16030"]
    environment: { <<: *hbase-env, HBASE_HEAPSIZE: "768m" }
    volumes: *hbase-volumes
    depends_on: [hbase-master]

  kafka:
    image: confluentinc/cp-kafka:7.9.10          # Kafka 3.9: last line with ZooKeeper mode (shared ZK)
    container_name: bda-kafka
    hostname: kafka
    profiles: ["streaming"]
    mem_limit: 768m
    ports: ["29092:29092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181/kafka
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 12
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    volumes: [kafka-data:/var/lib/kafka/data]
    depends_on: [zookeeper]

  storm-nimbus:
    image: storm:2.8.9
    container_name: bda-storm-nimbus
    hostname: storm-nimbus
    profiles: ["streaming"]
    command: storm nimbus
    mem_limit: 512m
    volumes:
      - &storm-conf ./docker/conf/storm/storm.yaml:/conf/storm.yaml     # rw: the image entrypoint chowns it
      - &storm-jars ./java/storm-topology/target:/opt/pulse-jars:ro
      - &storm-data ./data:/opt/pulse-data:ro
      # storm.local.dir holds the topology blobs. ZK (zk-data) outlives the container, so the blobs must too:
      # a nimbus recreated without them gives up leadership and every `storm jar` fails.
      - nimbus-data:/data
    depends_on: [zookeeper]

  storm-supervisor:
    image: storm:2.8.9
    container_name: bda-storm-supervisor
    hostname: storm-supervisor
    profiles: ["streaming"]
    command: storm supervisor
    mem_limit: 1g
    volumes: [*storm-conf, *storm-jars, *storm-data]
    depends_on: [storm-nimbus]

  storm-ui:
    image: storm:2.8.9
    container_name: bda-storm-ui
    hostname: storm-ui
    profiles: ["streaming"]
    command: storm ui
    mem_limit: 320m
    ports: ["8081:8080"]
    volumes: [*storm-conf, *storm-jars, *storm-data]
    depends_on: [storm-nimbus]

  airflow:                 # orchestrator: `airflow standalone` (scheduler + API server + DAG processor)
    image: bda/airflow:1
    container_name: bda-airflow
    hostname: airflow
    profiles: ["orchestrate"]
    command: standalone
    user: "50000:0"
    mem_limit: 1280m
    ports: ["8082:8080"]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: ${PROJECT_DIR}/airflow/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"     # local laptop UI, no login
      PROJECT_DIR: ${PROJECT_DIR}
      LITE: ${LITE:-0}
    volumes:
      # Same absolute path as on the host, so `docker compose` inside resolves bind mounts correctly
      - .:${PROJECT_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${PROJECT_DIR}
    depends_on: { postgres: { condition: service_healthy } }

  # --- Impala 4.5.3 (amd64-only images; Rosetta on Apple Silicon). Shares the Hive metastore and HDFS. ---
  impala-statestored:
    image: apache/impala:4.5.3-statestored
    platform: linux/amd64
    container_name: bda-impala-statestored
    hostname: impala-statestored
    profiles: ["impala"]
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1"]
    mem_limit: 256m
    ports: ["25010:25010"]
    volumes: &impala-conf
      - ./docker/conf/hadoop/core-site.xml:/opt/impala/conf/core-site.xml:ro
      - ./docker/conf/hadoop/hdfs-site.xml:/opt/impala/conf/hdfs-site.xml:ro
      - ./docker/conf/impala/hive-site.xml:/opt/impala/conf/hive-site.xml:ro

  impala-hms:              # CDP metastore server shipped inside the catalogd image; same Postgres DB as Hive
    image: apache/impala:4.5.3-catalogd
    platform: linux/amd64
    container_name: bda-impala-hms
    hostname: impala-hms
    profiles: ["impala"]
    entrypoint: ["/usr/lib/jvm/java-8-openjdk-amd64/bin/java", "-Xmx384m",
                 "-cp", "/opt/hms-conf:/opt/hms-lib/*:/opt/impala/lib/*", "org.apache.hadoop.hive.metastore.HiveMetaStore"]
    mem_limit: 768m
    environment: { HIVE_DB_PASSWORD: "${HIVE_DB_PASSWORD}" }
    ports: ["9084:9084"]
    volumes:
      - ./docker/conf/impala/hms-site.xml:/opt/hms-conf/hive-site.xml:ro
      - ./docker/cache/javax.jdo-3.2.0-m3.jar:/opt/hms-lib/javax.jdo-3.2.0-m3.jar:ro   # JDO API (not shipped with Impala)
      - ./docker/conf/hadoop/core-site.xml:/opt/hms-conf/core-site.xml:ro
      - ./docker/conf/hadoop/hdfs-site.xml:/opt/hms-conf/hdfs-site.xml:ro
      - ./docker/conf/hadoop/log4j.properties:/opt/hms-conf/log4j.properties:ro
    healthcheck: { test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9084"], interval: 5s, retries: 60 }

  impala-catalogd:
    image: apache/impala:4.5.3-catalogd
    platform: linux/amd64
    container_name: bda-impala-catalogd
    hostname: impala-catalogd
    profiles: ["impala"]
    # Event polling off: Apache HMS 3.1.3 lacks parts of the notification API Impala expects,
    # so metadata is refreshed explicitly (INVALIDATE METADATA / REFRESH in impala/setup.sql).
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1", "-state_store_host=impala-statestored",
              "-hms_event_polling_interval_s=0", "-invalidate_tables_timeout_s=999999"]
    mem_limit: 1g
    environment: { JAVA_TOOL_OPTIONS: "-Xmx512m", HIVE_DB_PASSWORD: "${HIVE_DB_PASSWORD}" }
    ports: ["25020:25020"]
    volumes: *impala-conf
    depends_on: { impala-statestored: { condition: service_started }, impala-hms: { condition: service_healthy } }

  impalad:
    image: apache/impala:4.5.3-impalad_coord_exec
    platform: linux/amd64
    container_name: bda-impalad
    hostname: impalad
    profiles: ["impala"]
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1",
              "-state_store_host=impala-statestored", "-catalog_service_host=impala-catalogd",
              "-mem_limit=900m", "-convert_legacy_hive_parquet_utc_timestamps=true",
              "-default_query_options=default_file_format=parquet"]
    mem_limit: 1536m
    environment: { JAVA_TOOL_OPTIONS: "-Xmx384m", HIVE_DB_PASSWORD: "${HIVE_DB_PASSWORD}" }
    ports: ["21050:21050", "25000:25000"]
    volumes: *impala-conf
    depends_on: [impala-statestored, impala-catalogd]

  edge:                    # client box: every CLI (pig, sqoop, hive, beeline, mahout, spark-submit, hbase) runs here
    <<: *hadoop
    image: bda/stack:1
    container_name: bda-edge
    hostname: edge
    profiles: ["batch", "warehouse", "ml", "serving", "streaming"]
    command: ["sleep", "infinity"]
    mem_limit: 1280m
    environment:
      <<: *hadoop-env
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      HIVE_DB_PASSWORD: "${HIVE_DB_PASSWORD}"
      CATALOGUE_DB_PASSWORD: "${CATALOGUE_DB_PASSWORD}"
      HADOOP_CLIENT_OPTS: "-Xmx512m"
      HBASE_DISABLE_HADOOP_CLASSPATH_LOOKUP: "true"
      HBASE_CLASSPATH: /opt/hadoop/etc/hadoop
      PATH: "/opt/pulse/bin:/opt/venv/bin:/opt/hive/bin:/opt/pig/bin:/opt/sqoop/bin:/opt/mahout/bin:/opt/spark/bin:/opt/hbase/bin:/opt/hadoop/bin:/opt/hadoop/sbin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - ./docker/conf/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./docker/conf/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./docker/conf/spark:/opt/spark/conf:ro      # directory mount: survives editors that replace files
      - ./docker/conf/hbase/hbase-site.xml:/opt/hbase/conf/hbase-site.xml:ro
      - .:/opt/pulse
      - sqoop-meta:/root/.sqoop        # saved Sqoop jobs (incremental last-value) survive container rebuilds
    working_dir: /opt/pulse
    depends_on: { namenode: { condition: service_healthy } }

volumes:
  kafka-data:
  zk-data:
  sqoop-meta:
  pg-data:
  nn-data:
  dn1-data:
  dn2-data:
  nimbus-data:

# Network name without "_": Hive resolves peers to <container>.<network>, and Java's URI parser
# rejects underscores in hostnames (URISyntaxException: thrift://bda-hive-metastore.bda_default:9083).
networks:
  default:
    name: pulse
